<p>For tutoring enquiries, tell me a little about what you study or do now and what you’d like help with.</p>

<form id="contact-form" action="https://formspree.io/f/xreebbpd" method="post">
  <div class="form-group">
    <label for="contact-name">Your name</label>
    <input type="text" id="contact-name" name="name" class="form-control" autocomplete="name" required>
  </div>

  <div class="form-group">
    <label for="contact-email">Your email</label>
    <input type="email" id="contact-email" name="_replyto" class="form-control" autocomplete="email" required>
  </div>

  <div class="form-group">
    <label for="contact-message">Your message</label>
    <textarea id="contact-message" name="message" class="form-control" rows="5" required></textarea>
  </div>

  <button type="submit" class="btn btn-primary">Send Message</button>
  <p id="contact-status" class="mt-3" role="status"></p>
</form>

<script>
  const contactForm = document.getElementById('contact-form');
  const contactStatus = document.getElementById('contact-status');
  const sendButton = contactForm.querySelector('button[type="submit"]');

  contactForm.addEventListener('submit', async (event) => {
    if (!window.fetch) return;
    event.preventDefault();
    if (sendButton.disabled) return;

    sendButton.disabled = true;
    contactStatus.textContent = 'Sending your message…';

    try {
      const response = await fetch(contactForm.action, {
        method: contactForm.method,
        body: new FormData(contactForm),
        headers: { Accept: 'application/json' },
      });

      if (response.ok) {
        contactForm.reset();
        contactStatus.textContent = 'Thanks, your message has been sent.';
      } else if (response.status === 429) {
        contactStatus.textContent = 'Please wait a minute before trying again.';
      } else {
        contactStatus.textContent = 'Your message could not be sent. Please try again.';
      }
    } catch {
      contactStatus.textContent = 'Your message could not be sent. Check your connection and try again.';
    } finally {
      sendButton.disabled = false;
    }
  });
</script>
